<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dungeon Architect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo">DUNGEON<span>ARCHITECT</span></div>
      <div class="stats">
        <div class="stat" id="st-wave"></div>
        <div class="stat heart" id="st-heart"></div>
        <div class="stat gold" id="st-gold"></div>
        <div class="stat souls" id="st-souls"></div>
        <div class="stat mana" id="st-mana"></div>
        <div class="stat deck" id="st-deck"></div>
      </div>
    </header>

    <main>
      <section id="board-wrap">
        <canvas id="board" width="648" height="360"></canvas>
        <div id="phase-banner"></div>
      </section>
      <aside id="side">
        <div class="panel"><h3 id="wave-title">Nächste Welle</h3><div id="wave-preview"></div></div>
        <div class="panel"><h3>Info</h3><div id="info-body"></div></div>
        <div class="panel"><h3>Artefakte</h3><div id="artifact-list"></div></div>
        <div class="panel grow"><h3>Chronik</h3><div id="log"></div></div>
      </aside>
    </main>

    <footer id="bottom">
      <div id="hand"></div>
      <div id="controls">
        <button id="btn-start" class="primary">Tür öffnen ▶</button>
        <button id="btn-mana"></button>
        <button id="btn-speed">Tempo 1×</button>
        <button id="btn-deck">Deck ansehen</button>
      </div>
    </footer>
  </div>

  <div id="overlay" class="hidden"><div id="modal"></div></div>

  <script src="js/data.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
